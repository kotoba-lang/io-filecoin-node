name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:lint
      - run: clojure -M:test

  cljs:
    # Not redundant with the JVM job. A header CID goes through BLAKE2b, whose
    # 64-bit arithmetic is a `long` there and a `BigInt` here; the two big
    # amounts in a header exceed 2^53; and the tipset ordering compares bytes
    # that are signed on one runtime and not the other. The mainnet CIDs and
    # the tipset order come out the same on both or the codec is wrong on one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: npm install -g nbb
      # @noble/hashes is not used here; io-multiformats' :cljs branch loads it
      # at require time, so the path will not start without it.
      - run: npm ci
      - run: nbb --classpath "$(clojure -A:cljs -Spath)" scripts/verify-cljs.cljs
